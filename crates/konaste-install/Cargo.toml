[package]
name = "konaste-install"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
konaste-bootstrap = { path = "../konaste-bootstrap" }
konaste-runtime = { path = "../konaste-runtime" }
konaste-discovery = { path = "../konaste-discovery" }
konaste-manifest = { path = "../konaste-manifest" }
konaste-updater = { path = "../konaste-updater" }
thiserror = "2"

[dev-dependencies]
hex = "0.4"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
