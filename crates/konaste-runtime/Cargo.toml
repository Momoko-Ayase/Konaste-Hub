[package]
name = "konaste-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
konaste-bootstrap = { path = "../konaste-bootstrap" }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
quick-xml = "=0.42.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
