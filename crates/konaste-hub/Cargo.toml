[package]
name = "konaste-hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "konaste-hub"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.11.0"
# Same version gpui already resolves; decodes official art and icons.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"
scraper = "0.29"
cookie = "0.18"
raw-window-handle = "0.6"
base64 = "0.23"
hex = "0.4"
sha2 = "0.11"
konaste-updater = { path = "../konaste-updater" }
konaste-install = { path = "../konaste-install" }
konaste-bootstrap = { path = "../konaste-bootstrap" }
konaste-discovery = { path = "../konaste-discovery" }
konaste-runtime = { path = "../konaste-runtime" }

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }
winreg = "0.56"
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = ["Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_Networking_WindowsWebServices", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
