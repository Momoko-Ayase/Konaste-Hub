name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked -p konaste-hub --bin konaste-hub

      - name: Stage
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipBuild -Output dist

      - uses: actions/upload-artifact@v7
        with:
          name: konaste-hub-${{ github.sha }}
          path: dist/
          if-no-files-found: error
