name: Release

# Runs when a release is published on GitHub. The release must be tagged
# v<version> matching Cargo.toml. The Hub only offers a release once both
# assets below are attached, so it is safe to publish before they upload.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  TAG: ${{ github.event.release.tag_name }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match Cargo.toml version $version." }

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Output dist -Installer

      # The checksum list goes up last: the Hub needs both files, so it never
      # offers a release whose setup is still uploading.
      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG (Get-Item dist/KonasteHub-*-setup.exe).FullName --clobber --repo ${{ github.repository }}
          gh release upload $env:TAG dist/SHA256SUMS.txt --clobber --repo ${{ github.repository }}
